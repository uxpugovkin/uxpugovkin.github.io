<!doctype html>
<html lang="en" dir="ltr" data-root="../">
<head>
  <!-- Page settings: title, description for Google and link previews,
       and the browser bar colour for day and night (theme-color) -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MA.mobile — Konstantin P</title>
  <meta name="description" content="Konstantin P — Product Designer. MA.mobile case study, coming soon.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191721" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <!-- The small icon in the browser tab -->
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <!-- Styles: habibi tokens first, then the site styles (order matters) -->
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <!-- Visit counter (GoatCounter): https://uxpugovkin.goatcounter.com -->
  <script data-goatcounter="https://uxpugovkin.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body data-page="ma-mobile">
  <!-- "Skip to content" — only visible to keyboard users who press Tab -->
  <a class="skip-link body-c-regular" href="#main">Skip to content</a>
  <div class="app">
    <!-- SIDEBAR — left empty on purpose. It is filled in automatically from
         the menu list in assets/js/config.js, so every page shows the same menu. -->
    <header class="sidebar" data-sidebar></header>
    <!-- Scripts — the order matters:
         config.js        the name, role and menu list
         icons.js         the sidebar icons
         sidebar.js       builds the sidebar from the two files above
         mobile-bar.js    hides the phone top bar on scroll down
         image-loader.js  grey pulsing placeholder until images load
         toggle-media.js  the "AI scene" switch that swaps two images -->
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/icons.js"></script>
    <script src="../assets/js/sidebar.js"></script>
    <script src="../assets/js/mobile-bar.js"></script>
    <script src="../assets/js/image-loader.js"></script>
    <script src="../assets/js/toggle-media.js"></script>

    <!-- === PAGE CONTENT ===
         Blocks stack top to bottom, 20px apart (vert-space), in the same
         order as the Content frame in Figma. -->
    <main class="content" id="main">
      <!-- Page title for screen readers and Google (not shown on screen) -->
      <h1 class="visually-hidden">MA.mobile</h1>

      <!-- Replace this empty state with the case study content
           (copy the header and sections from any other case study folder) -->
      <section class="empty-state" aria-label="MA.mobile">
        <span class="image-loader">
          <picture>
            <source srcset="../assets/img/empty-state.webp" type="image/webp">
            <img class="empty-state__image" src="../assets/img/empty-state.png" width="128" height="128" alt="A cartoon proboscis monkey holding a green table-tennis paddle and a yellow ball">
          </picture>
        </span>
        <div class="empty-state__text">
          <p class="empty-state__title body-b-bold">MA.mobile is coming soon</p>
          <p class="empty-state__body body-c-regular">This case study is still in progress. Pick another one from the menu or the home page.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
